<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Organizer · Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body, html { height: 100%; margin: 0; }
    .login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 32px;
      background: var(--bg);
    }
    .login-logo {
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -2px;
      line-height: 1;
    }
    .login-logo span { color: var(--accent); }
    .login-tagline {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      max-width: 240px;
    }
    .login-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--r-xl);
      padding: 24px 20px;
      width: 100%;
      max-width: 320px;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .login-card-title {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
    }
    .login-btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: white;
      color: #1a1a1a;
      border: none;
      border-radius: var(--r-md);
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      width: 100%;
    }
    .login-btn-google:hover { opacity: .9; transform: scale(1.02); }
    .login-btn-google:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .login-btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }
    .login-error {
      font-size: 12px;
      color: #f87171;
      text-align: center;
      display: none;
    }
    .login-error.visible { display: block; }
  </style>
  <style>html { background: #0a0914; }</style>
</head>
<body>
<div class="login-page">
  <div class="login-logo">Life<span>.</span></div>
  <p class="login-tagline">Organize sua vida, seus treinos e seus objetivos.</p>

  <div class="login-card">
    <div class="login-card-title">Entrar na sua conta</div>
    <button class="login-btn-google" id="login-btn">
      <svg viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.86l6.08-6.08C34.46 3.1 29.5 1 24 1 14.82 1 7.07 6.49 3.64 14.22l7.08 5.5C12.4 13.67 17.73 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.1 24.5c0-1.64-.15-3.22-.42-4.75H24v9h12.42c-.54 2.9-2.18 5.36-4.64 7.01l7.19 5.58C43.18 37.1 46.1 31.27 46.1 24.5z"/>
        <path fill="#FBBC05" d="M10.72 28.28A14.6 14.6 0 0 1 9.5 24c0-1.49.26-2.93.72-4.28l-7.08-5.5A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.58 10.76l8.14-6.48z"/>
        <path fill="#34A853" d="M24 47c5.5 0 10.12-1.82 13.49-4.95l-7.19-5.58C28.6 38.13 26.42 39 24 39c-6.27 0-11.6-4.17-13.28-9.72l-8.14 6.48C6.07 43.51 14.47 47 24 47z"/>
      </svg>
      Entrar com Google
    </button>
    <p class="login-error" id="login-error">Erro ao fazer login. Tente novamente.</p>
  </div>
</div>

<script type="module">
  import { loginGoogle, onAuthChange } from './js/firebase.js';

  // Se já está logado, redireciona para a página de origem ou index
  onAuthChange((user) => {
    if (user) {
      const redirect = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
      window.location.replace(redirect);
    }
  });

  document.getElementById('login-btn').addEventListener('click', async () => {
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');
    btn.disabled = true;
    btn.textContent = 'Entrando...';
    err.classList.remove('visible');
    try {
      await loginGoogle();
      // onAuthChange cuida do redirect
    } catch (e) {
      console.error(e);
      err.classList.add('visible');
      btn.disabled = false;
      btn.innerHTML = `<svg viewBox="0 0 48 48" width="18" height="18"><path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.86l6.08-6.08C34.46 3.1 29.5 1 24 1 14.82 1 7.07 6.49 3.64 14.22l7.08 5.5C12.4 13.67 17.73 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.64-.15-3.22-.42-4.75H24v9h12.42c-.54 2.9-2.18 5.36-4.64 7.01l7.19 5.58C43.18 37.1 46.1 31.27 46.1 24.5z"/><path fill="#FBBC05" d="M10.72 28.28A14.6 14.6 0 0 1 9.5 24c0-1.49.26-2.93.72-4.28l-7.08-5.5A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.58 10.76l8.14-6.48z"/><path fill="#34A853" d="M24 47c5.5 0 10.12-1.82 13.49-4.95l-7.19-5.58C28.6 38.13 26.42 39 24 39c-6.27 0-11.6-4.17-13.28-9.72l-8.14 6.48C6.07 43.51 14.47 47 24 47z"/></svg> Entrar com Google`;
    }
  });
</script>
</body>
</html>
