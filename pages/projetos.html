<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projetos — Life Organizer</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* ── Forms ── */
    .add-form{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r-xl);padding:16px 18px;margin-bottom:16px;}
    .form-title{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;}
    .input-row{display:flex;gap:8px;margin-bottom:8px;}
    .field-input{flex:1;background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--r-md);padding:9px 12px;color:var(--text);font-family:var(--font-body);font-size:13px;outline:none;}
    .field-input:focus{border-color:var(--accent);}
    .field-input::placeholder{color:var(--subtle);}
    .save-btn{width:100%;padding:11px;background:var(--accent);border:none;border-radius:var(--r-md);color:#fff;font-family:var(--font-display);font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;}
    .save-btn:hover{opacity:.88;}
    .small-btn{padding:8px 14px;background:var(--accent);border:none;border-radius:var(--r-md);color:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;}
    .ghost-btn{padding:7px 14px;background:none;border:0.5px solid var(--border2);border-radius:var(--r-md);color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
    .ghost-btn:hover{border-color:var(--coral);color:var(--coral);}

    /* ── Status filter ── */
    .status-filter{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;}
    .sf-btn{flex-shrink:0;font-size:11px;font-weight:600;padding:5px 14px;border-radius:99px;background:var(--surface);border:0.5px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
    .sf-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

    /* ── Project card ── */
    .project-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r-xl);margin-bottom:14px;overflow:hidden;transition:border-color .2s;}
    .project-card:hover{border-color:var(--border2);}
    .project-header{padding:16px 18px 0;}
    .proj-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;}
    .proj-emoji{font-size:26px;flex-shrink:0;line-height:1.1;}
    .proj-info{flex:1;min-width:0;}
    .proj-title{font-family:var(--font-display);font-size:16px;font-weight:800;color:var(--text);line-height:1.2;}
    .proj-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;}
    .proj-status-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;flex-shrink:0;cursor:pointer;}
    .badge-active  {background:rgba(74,222,128,.12);color:var(--green);}
    .badge-planning{background:rgba(251,191,36,.12);color:var(--amber);}
    .badge-idea    {background:rgba(124,111,247,.12);color:var(--accent2);}
    .badge-paused  {background:rgba(248,113,113,.12);color:var(--coral);}
    .badge-done    {background:rgba(74,222,128,.2);color:var(--green);}
    .proj-del{background:none;border:none;color:var(--subtle);cursor:pointer;font-size:18px;padding:2px 5px;opacity:0;transition:opacity .15s,color .15s;flex-shrink:0;}
    .project-card:hover .proj-del{opacity:1;}
    .proj-del:hover{color:var(--coral);}

    /* ── Progress ── */
    .proj-progress{padding:0 18px 14px;}
    .proj-prog-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
    .proj-prog-pct{font-family:var(--font-display);font-size:13px;font-weight:700;}
    .proj-prog-count{font-size:11px;color:var(--muted);}
    .proj-bar-track{height:6px;background:var(--bg3);border-radius:99px;overflow:hidden;}
    .proj-bar-fill{height:100%;border-radius:99px;transition:width .5s ease;}

    /* ── Mini tasks ── */
    .mini-tasks{border-top:0.5px solid var(--border);}
    .mini-row{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:0.5px solid var(--border);transition:background .1s;}
    .mini-row:hover{background:var(--bg3);}
    .mini-row:last-child{border-bottom:none;}
    .mini-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border2);background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
    .mini-check.checked{background:var(--accent);border-color:var(--accent);}
    .mini-check:hover{border-color:var(--accent);}
    .mini-label{flex:1;font-size:13px;color:var(--text);transition:opacity .2s;}
    .mini-label.done{opacity:.38;text-decoration:line-through;}
    .mini-del{background:none;border:none;color:var(--subtle);cursor:pointer;font-size:14px;padding:2px 5px;opacity:0;transition:opacity .15s,color .15s;}
    .mini-row:hover .mini-del{opacity:1;}
    .mini-del:hover{color:var(--coral);}

    /* ── Add mini task ── */
    .add-mini-row{display:flex;gap:7px;padding:10px 18px;background:var(--bg3);border-top:0.5px solid var(--border);}
    .mini-input{flex:1;background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--r-md);padding:7px 11px;color:var(--text);font-family:var(--font-body);font-size:12px;outline:none;}
    .mini-input:focus{border-color:var(--accent);}
    .mini-input::placeholder{color:var(--subtle);}
    .mini-add-btn{width:30px;height:30px;background:var(--accent);border:none;border-radius:var(--r-md);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:opacity .15s;}
    .mini-add-btn:hover{opacity:.85;}

    /* ── Color picker ── */
    .color-row{display:flex;gap:7px;margin-bottom:10px;}
    .color-opt{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0;}
    .color-opt.selected{border-color:#fff;transform:scale(1.15);}

    /* ── Status select chips ── */
    .status-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
    .status-chip{font-size:11px;font-weight:600;padding:6px 12px;border-radius:99px;cursor:pointer;border:0.5px solid var(--border);background:var(--bg3);color:var(--muted);transition:all .15s;}
    .status-chip.active{border-color:var(--accent);background:rgba(124,111,247,.12);color:var(--accent2);}

    /* ── Completed badge ── */
    .done-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(74,222,128,.12);color:var(--green);margin-left:auto;}

    /* ── Empty ── */
    .empty-state{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px;}
    .empty-icon{font-size:32px;margin-bottom:8px;}
  </style>
  <style>html { background: #0a0914; }</style>
</head>
<body>
<div class="app-wrapper">
  <header class="page-header">
    <a href="../index.html" class="page-header-back" aria-label="Voltar">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="10,3 5,8 10,13"/></svg>
    </a>
    <div>
      <div class="page-title">🚀 Projetos</div>
      <div class="page-subtitle" id="proj-subtitle">0 projetos</div>
    </div>
  </header>

  <main class="page-content">

    <!-- Status filter -->
    <div class="status-filter fade-up" id="status-filter">
      <button class="sf-btn active" onclick="setFilter('todos',this)">Todos</button>
      <button class="sf-btn" onclick="setFilter('active',this)">🟢 Ativo</button>
      <button class="sf-btn" onclick="setFilter('planning',this)">🟡 Planejando</button>
      <button class="sf-btn" onclick="setFilter('idea',this)">💡 Ideia</button>
      <button class="sf-btn" onclick="setFilter('paused',this)">⏸ Pausado</button>
      <button class="sf-btn" onclick="setFilter('done',this)">✓ Concluído</button>
    </div>

    <!-- Project list -->
    <div id="project-list"></div>

    <!-- Add project form -->
    <div class="add-form fade-up">
      <div class="form-title">+ Novo projeto</div>
      <div class="input-row">
        <input type="text" class="field-input" id="p-title" placeholder="Nome do projeto...">
        <input type="text" class="field-input" id="p-emoji" placeholder="🚀" style="max-width:62px;">
      </div>
      <div class="input-row">
        <input type="text" class="field-input" id="p-desc" placeholder="Descrição (opcional)...">
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">Status</div>
      <div class="status-chips">
        <span class="status-chip active" data-val="active"   onclick="selectStatus(this)">🟢 Ativo</span>
        <span class="status-chip"        data-val="planning" onclick="selectStatus(this)">🟡 Planejando</span>
        <span class="status-chip"        data-val="idea"     onclick="selectStatus(this)">💡 Ideia</span>
        <span class="status-chip"        data-val="paused"   onclick="selectStatus(this)">⏸ Pausado</span>
      </div>
      <input type="hidden" id="p-status" value="active">
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">Cor da barra</div>
      <div class="color-row" id="p-color-row">
        <div class="color-opt selected" style="background:#7c6ff7;" data-color="#7c6ff7" onclick="selectColor(this)"></div>
        <div class="color-opt" style="background:#34d399;" data-color="#34d399" onclick="selectColor(this)"></div>
        <div class="color-opt" style="background:#fbbf24;" data-color="#fbbf24" onclick="selectColor(this)"></div>
        <div class="color-opt" style="background:#f472b6;" data-color="#f472b6" onclick="selectColor(this)"></div>
        <div class="color-opt" style="background:#60a5fa;" data-color="#60a5fa" onclick="selectColor(this)"></div>
        <div class="color-opt" style="background:#f87171;" data-color="#f87171" onclick="selectColor(this)"></div>
      </div>
      <input type="hidden" id="p-color" value="#7c6ff7">
      <button class="save-btn" onclick="addProject()">Criar projeto</button>
    </div>

  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <a href="../index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Início</span></a>
    <a href="calendario.html" class="nav-item"><span class="nav-icon">📅</span><span class="nav-label">Calendário</span></a>
    <a href="rotina.html" class="nav-item"><span class="nav-icon">🔄</span><span class="nav-label">Rotina</span></a>
    <a href="basquete.html" class="nav-item"><span class="nav-icon">🏀</span><span class="nav-label">Basquete</span></a>
    <a href="estudos.html" class="nav-item"><span class="nav-icon">📚</span><span class="nav-label">Estudos</span></a>
  </nav>
</div>

<script>
// ── Storage ──────────────────────────────────────────────────
function getProjects(){ return JSON.parse(localStorage.getItem('projects2')||'[]'); }
function saveProjects(d){ localStorage.setItem('projects2',JSON.stringify(d)); }

// ── Filter ───────────────────────────────────────────────────
let activeFilter = 'todos';
function setFilter(f, btn){
  activeFilter = f;
  document.querySelectorAll('.sf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderProjects();
}

// ── Status selector (add form) ────────────────────────────────
function selectStatus(el){
  document.querySelectorAll('.status-chips .status-chip').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('p-status').value = el.dataset.val;
}

// ── Color picker ─────────────────────────────────────────────
function selectColor(el){
  document.querySelectorAll('#p-color-row .color-opt').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('p-color').value = el.dataset.color;
}

// ── Add project ───────────────────────────────────────────────
function addProject(){
  const title  = document.getElementById('p-title').value.trim();
  const emoji  = document.getElementById('p-emoji').value.trim() || '🚀';
  const desc   = document.getElementById('p-desc').value.trim();
  const status = document.getElementById('p-status').value;
  const color  = document.getElementById('p-color').value;
  if(!title) return;
  const projects = getProjects();
  projects.unshift({ id:'p_'+Date.now(), title, emoji, desc, status, color, tasks:[] });
  saveProjects(projects);
  ['p-title','p-emoji','p-desc'].forEach(id=>document.getElementById(id).value='');
  renderProjects();
}

function deleteProject(id){
  saveProjects(getProjects().filter(p=>p.id!==id));
  renderProjects();
}

function cycleStatus(id){
  const cycle = ['active','planning','idea','paused','done'];
  const projects = getProjects();
  const p = projects.find(p=>p.id===id);
  if(!p) return;
  const cur = cycle.indexOf(p.status);
  p.status = cycle[(cur+1)%cycle.length];
  saveProjects(projects);
  renderProjects();
}

// ── Mini tasks ───────────────────────────────────────────────
function addTask(pId){
  const input = document.getElementById('task-input-'+pId);
  const text = input.value.trim();
  if(!text) return;
  const projects = getProjects();
  const p = projects.find(p=>p.id===pId);
  if(!p) return;
  p.tasks.push({ id:'t_'+Date.now(), text, done:false });
  saveProjects(projects);
  input.value = '';
  renderProjects();
}

function toggleTask(pId, tId){
  const projects = getProjects();
  const p = projects.find(p=>p.id===pId);
  if(!p) return;
  const t = p.tasks.find(t=>t.id===tId);
  if(!t) return;
  t.done = !t.done;
  saveProjects(projects);
  renderProjects();
}

function deleteTask(pId, tId){
  const projects = getProjects();
  const p = projects.find(p=>p.id===pId);
  if(!p) return;
  p.tasks = p.tasks.filter(t=>t.id!==tId);
  saveProjects(projects);
  renderProjects();
}

// ── Status helpers ────────────────────────────────────────────
const statusLabel = { active:'🟢 Ativo', planning:'🟡 Planejando', idea:'💡 Ideia', paused:'⏸ Pausado', done:'✓ Concluído' };
const statusBadge = { active:'badge-active', planning:'badge-planning', idea:'badge-idea', paused:'badge-paused', done:'badge-done' };

// ── Render ───────────────────────────────────────────────────
function renderProjects(){
  let projects = getProjects();
  const total = projects.length;

  if(activeFilter !== 'todos') projects = projects.filter(p=>p.status===activeFilter);

  document.getElementById('proj-subtitle').textContent =
    total === 0 ? '0 projetos' : `${total} projeto${total!==1?'s':''}`;

  const el = document.getElementById('project-list');
  if(!projects.length){
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">🚀</div>${activeFilter==='todos'?'Nenhum projeto ainda.<br>Crie o seu primeiro abaixo!':'Nenhum projeto com esse status.'}</div>`;
    return;
  }

  el.innerHTML = projects.map(p=>{
    const total  = p.tasks.length;
    const done   = p.tasks.filter(t=>t.done).length;
    const pct    = total > 0 ? Math.round((done/total)*100) : 0;
    const completed = total > 0 && done === total;
    const barColor  = completed ? 'var(--green)' : p.color;

    return `
    <div class="project-card">
      <div class="project-header">
        <div class="proj-top">
          <span class="proj-emoji">${p.emoji}</span>
          <div class="proj-info">
            <div class="proj-title">${p.title}</div>
            ${p.desc ? `<div class="proj-desc">${p.desc}</div>` : ''}
          </div>
          <span class="proj-status-badge ${statusBadge[p.status]}" onclick="cycleStatus('${p.id}')" title="Clique para mudar status">${statusLabel[p.status]}</span>
          ${completed ? `<span class="done-badge">✓</span>` : ''}
          <button class="proj-del" onclick="deleteProject('${p.id}')">×</button>
        </div>

        ${total > 0 ? `
        <div class="proj-progress" style="padding:0 0 14px;">
          <div class="proj-prog-header">
            <span class="proj-prog-pct" style="color:${barColor};">${pct}%</span>
            <span class="proj-prog-count">${done} de ${total} tarefa${total!==1?'s':''}</span>
          </div>
          <div class="proj-bar-track">
            <div class="proj-bar-fill" style="width:${pct}%;background:${barColor};"></div>
          </div>
        </div>` : '<div style="padding-bottom:14px;"></div>'}
      </div>

      <!-- Task list -->
      <div class="mini-tasks">
        ${p.tasks.map(t=>`
          <div class="mini-row">
            <button class="mini-check ${t.done?'checked':''}" onclick="toggleTask('${p.id}','${t.id}')" aria-label="Marcar">
              ${t.done?'<svg width="10" height="10" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}
            </button>
            <span class="mini-label ${t.done?'done':''}">${t.text}</span>
            <button class="mini-del" onclick="deleteTask('${p.id}','${t.id}')">×</button>
          </div>`).join('')}

        <div class="add-mini-row">
          <input type="text" class="mini-input" id="task-input-${p.id}"
            placeholder="+ Adicionar tarefa..."
            onkeydown="if(event.key==='Enter') addTask('${p.id}')">
          <button class="mini-add-btn" onclick="addTask('${p.id}')">+</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Init ─────────────────────────────────────────────────────
renderProjects();
</script>
<script type="module" src="../js/auth-guard.js"></script>
</body>
</html>
